version: '3.9'

services:
  postgres_meexuu:
    image: postgres:15-alpine
    container_name: meexuu_postgres_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-meexuu_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meexuu_secret_2026}
      POSTGRES_DB: ${DB_NAME:-db_meexuu}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_meexuu:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meexuu_network

volumes:
  pgdata_meexuu:
    name: meexuu_pgdata_volume

networks:
  meexuu_network:
    name: meexuu_interactive_net
    driver: bridge

